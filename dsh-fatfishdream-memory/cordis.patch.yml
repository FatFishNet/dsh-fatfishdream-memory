# dsh-memory bundle patch。
#
# 架构：零工具。记忆的读写不依赖注册任何工具。
#
#  读记忆 → systemPrompt.context 注入（纯文本）
#  写记忆 → 模型用已有的 write / edit（路径由注入给出）
#  查记忆 → 模型用已有的 grep / read
#  自动捕获 → session/event 监听情绪，直接写 facts.md
#  轮次提醒 → turn-stopping 时 steer 一句纯文本
#
# 为什么不用工具：工具 schema 会进入每次模型请求的 tools 数组，
# 而反代/中转通道（实测 workbuddy）会以「工具的参数结构不符合当前模型要求」
# 拒绝整个请求 —— 一个工具坏掉，该 profile 下所有会话全部无法发出消息。
# 2026-11-11 因此中断过两次。system 文本任何 OpenAI 兼容接口都必须支持，
# 所以把「让模型知道有记忆、怎么用」放进注入是唯一在所有通道都安全的做法。
#
# 本版本**永久不注册任何工具**，配置里没有开关。
# 旧版本曾有 toolsEnabled 字段，现已移除；若老配置文件里还留着，会被忽略并记一条诊断日志。
#
# 预算说明：
#   factsBytes   用户级结论的注入上限
#   policyBytes  全局规则（policy.md「给模型的规则」小节）的注入上限
#   projectBytes 项目结论的注入上限
# 都是字节数，不是 token。超了会按 section 顺序截断并标注「已截断」。
#
# 关于该给多少：这些值被反复顶穿过 —— facts 300 → 1500，
# project 300 → 500 → 2048 → 4096。规律是「项目一活跃，结论就长」，
# 每次一小步地加，永远在临界点上。2026-11-11 一次给足：
#
#   8000 字节约 76 条中文结论，约 1778 token/轮（填满时的值）。
#
# ⚠️ 这是**上限而非固定开销**：实际只按现有内容的字节数计费。
# 内容少的时候花得少，给足上限不等于每轮多花这些 token。
#
# 但仍保留「用量 N/M 字节」显示。内容真的堆到接近上限时，
# 该精简的是文件（合并同类、标 [stale]），而不是继续加预算。
#
# ---------------------------------------------------------------- root 为什么留空
#
# 这里**刻意不给 root**。曾经写死过 `root: 'D:\FatFishDream-memory'`，
# 那是开发机上的路径，随包分发给所有人会造成三种故障（2026-11-13 发现）：
#
#   - 用户没有 D 盘      → 启动即失败
#   - 有 D 盘但无写权限   → 启动即失败
#   - 有 D 盘            → 记忆被塞进一个他从没指定过的位置
#
# 留空后走 index.js 的 resolveRoot 四级选址（那段注释写得很细）：
#   1. 用户手写的明确路径（留空 = 跳过）
#   2. 指针文件 ~/.dsh/memory-root.json —— 上次实际用过的目录
#   3. 已知盘上的同名目录（兼容没有指针的老安装）
#   4. 首次安装：优先 D 盘 → 其他非系统盘按剩余空间 → 都没有才落「文档」目录
#
# 老用户（有指针的）路径完全不变；新用户自动选址，不会被强加一个盘符。
# 要固定某台机器的位置，请改用 GUI 设置页的「存储设置」——那会写指针文件，
# 而且是用户自己的决定，不是包作者替他决定。
- insert:
    - id: dsh-memory
      name: 'dsh-fatfishdream-memory'
      config:
        factsBytes: 8000
        policyBytes: 8000
        projectBytes: 4096
        consolidateDays: 7
